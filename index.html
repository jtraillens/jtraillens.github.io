<!DOCTYPE html>
<html>
<head>
    <title>JTrailLens</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css"></link>
    <script src="js/lightbox.js" defer></script>
    <script src="js/gallery.js" defer></script>
</head>
<body>
    <h1>JTrailLens</h1>
    <p>Exploring public lands and the small details found along the way.</p>
    
    <div id="tagFilter">
        <div id="tagSearch">
            <input id="tagInput" placeholder="Filter by tag">
            <div id="tagSuggestions"></div>
        </div>
        <div id="selectedTags"></div>
    </div>

    <div class="gallery">
    </div>

    <template id='photo-template'>
        <div class='gallery-item'>
            <img class='photo' alt='' loading="lazy">
            <div class='caption'></div>
        </div>
    </template>    

    <div class="lightbox" hidden>
        <div class="lightbox-content">
            <button class="lightbox-prev">&larr;</button>
            <div class="lightbox-taxon">
                <a target="_blank" rel="noopener noreferrer">View on iNaturalist</a>
            </div>            
            <img class="lightbox-image" alt="">

            <div class="lightbox-details">
                <div class="lightbox-title"></div>
                <div class="lightbox-meta"></div>
                <div class="lightbox-caption"></div>
            </div>
            
            <button class="lightbox-next">&rarr;</button>
            <button class="lightbox-close">x</button>        
        </div>
    </div>    
</body>
</html>
